[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roguewatch"
version = "0.1.0"
description = "Defensive AI-agent and covert coordination anomaly hunter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "networkx>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
roguewatch = "roguewatch.cli:main"

[tool.setuptools.packages.find]
include = ["roguewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
